<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planned · 일정 관리</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/runtime-config.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="auth-page" data-auth-anonymous>
      <section class="auth-hero">
        <a class="brand brand-light" href="#">planned<span>.</span></a>
        <div class="hero-copy"><p class="eyebrow">YOUR TIME, IN FOCUS</p><h1>일정을<br />명확하게.</h1><p>해야 할 일을 한곳에 모으고, 다음 일정에 집중하세요.</p></div>
        <p class="hero-foot">Plan lightly. Remember what matters.</p>
      </section>
      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="auth-card">
          <p class="eyebrow">SCHEDULE WORKSPACE</p><h2 id="auth-title" data-auth-title>다시 만나서 반가워요</h2><p class="auth-subtitle" data-auth-subtitle>계속하려면 로그인하세요.</p>
          <div class="auth-tabs" role="tablist" aria-label="계정 작업"><button type="button" class="tab active" data-auth-mode="login" role="tab" aria-selected="true">로그인</button><button type="button" class="tab" data-auth-mode="register" role="tab" aria-selected="false">회원가입</button></div>
          <p class="feedback" data-auth-message aria-live="polite">API Gateway로 안전하게 연결합니다.</p>
          <form class="auth-form" data-login-form><label>이메일<input type="email" name="email" autocomplete="email" required /></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" required /></label><button type="submit" class="button button-primary">로그인</button></form>
          <form class="auth-form" data-register-form hidden><label>이름<input type="text" name="display_name" autocomplete="name" maxlength="100" required /></label><label>이메일<input type="email" name="email" autocomplete="email" required /></label><label>비밀번호<input type="password" name="password" autocomplete="new-password" minlength="1" required /></label><label>시간대<input type="text" name="timezone" data-timezone maxlength="64" required /></label><button type="submit" class="button button-primary">계정 만들기</button></form>
        </div>
      </section>
    </main>
    <div class="app-shell" data-authenticated hidden>
      <aside class="sidebar" aria-label="주 메뉴"><a class="brand" href="#dashboard">planned<span>.</span></a><nav><a class="nav-link" href="#dashboard" data-route="dashboard"><span>⌂</span> 개요</a><a class="nav-link" href="#schedules" data-route="schedules"><span>□</span> 모든 일정</a><a class="nav-link" href="#create" data-route="create"><span>＋</span> 일정 만들기</a></nav><div class="sidebar-footer">v<span data-version>dev</span></div></aside>
      <section class="workspace"><header class="topbar"><button class="menu-button" type="button" data-menu-toggle aria-label="메뉴 열기">☰</button><div class="crumb"><span data-page-kicker>개요</span><strong data-page-title>내 일정</strong></div><div class="top-actions"><span class="connection" data-status title="웹 서비스 상태"></span><button class="icon-button" type="button" data-theme-toggle aria-label="테마 전환">◐</button><button class="profile-button" type="button" data-logout aria-label="로그아웃">로그아웃</button></div></header><main class="content" data-view></main><footer>Planned · <span data-version>dev</span></footer></section>
    </div>
  </body>
</html>
